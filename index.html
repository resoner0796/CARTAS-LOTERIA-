<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lotería WebApp</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }

    .pantalla {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background-size: cover;
      background-position: center;
      animation: fadein 0.5s ease-in;
    }

    .pantalla.activa {
      display: flex;
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #pantallaSplash {
      background-image: url("splash.PNG");
    }

    #pantallaSala, #pantallaNickname {
      background-color: #222;
    }

    #pantallaSeleccion {
      background-image: url("fondo-seleccion.PNG");
    }

    #pantallaJuego {
      background-image: url("fondo-juego.PNG");
    }

    .cartas-container, .juego-cartas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .carta-img {
      width: 180px;
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .carta-img.seleccionada {
      transform: scale(1.05);
      box-shadow: 0 0 15px gold;
      border-color: gold;
    }

    .carta-juego {
      position: relative;
      width: 250px;
    }

    .carta-juego img {
      width: 100%;
    }

    .ficha {
      position: absolute;
      pointer-events: none;
      width: 40px;
      transform: translate(-50%, -50%);
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: gold;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    #historial {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      padding: 0 1rem;
      max-width: 90vw;
      white-space: nowrap;
    }

    #historial img {
      width: 40px;
      border-radius: 5px;
    }

    #jugadoresLista {
      margin-top: 1rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- Contenido oculto aquí para brevedad -->
  <script src="https://loteria-backend-3nde.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://loteria-backend-3nde.onrender.com");

    let nickname = "";
    let soyHost = false;
    let seleccionadas = [];
    let salaActual = "";
    const cartasDisponibles = Array.from({ length: 20 }, (_, i) => String(i + 1).padStart(2, '0'));

    const pantallas = {
      splash: document.getElementById("pantallaSplash"),
      sala: document.getElementById("pantallaSala"),
      nickname: document.getElementById("pantallaNickname"),
      seleccion: document.getElementById("pantallaSeleccion"),
      juego: document.getElementById("pantallaJuego")
    };

    const contenedorCartas = document.getElementById("contenedorCartas");
    const juegoCartas = document.getElementById("juegoCartas");
    const btnIniciar = document.getElementById("btnIniciar");
    const historial = document.getElementById("historial");
    const jugadoresLista = document.getElementById("jugadoresLista");

    const audioCampana = new Audio("campana.mp3");
    const audioCorre = new Audio("corre.mp3");
    const audioAplausos = new Audio("aplausos.mp3");
    const audioCarta = new Audio("carta.mp3");

    window.onload = () => {
      setTimeout(() => cambiarPantalla("sala"), 1000);
    };

    function cambiarPantalla(nombre) {
      Object.values(pantallas).forEach(p => p.classList.remove("activa"));
      pantallas[nombre].classList.add("activa");
    }

    function irANickname() {
      salaActual = document.getElementById("salaSelect").value;
      cambiarPantalla("nickname");
    }

    function entrarJuego() {
      nickname = document.getElementById("nicknameInput").value.trim();
      if (!nickname) return alert("Escribe tu nombre");
      socket.emit("unirse-sala", { nickname, sala: salaActual });
    }

    socket.on("rol-asignado", ({ host }) => {
      soyHost = host;
      cambiarPantalla("seleccion");
      generarCartas();
      if (!soyHost) {
        ["btnBarajear", "btnIniciarJuego", "btnDetenerJuego", "btnReiniciar"].forEach(id => {
          document.getElementById(id).style.display = "none";
        });
      }
    });

    function generarCartas() {
      contenedorCartas.innerHTML = "";
      cartasDisponibles.forEach(id => {
        const img = document.createElement("img");
        img.src = `${id}.jpg`;
        img.classList.add("carta-img");
        img.dataset.id = id;
        img.onclick = () => seleccionarCarta(img);
        contenedorCartas.appendChild(img);
      });
    }

    function seleccionarCarta(img) {
      const id = img.dataset.id;
      if (seleccionadas.includes(id)) return;
      if (seleccionadas.length < 2) {
        img.classList.add("seleccionada");
        seleccionadas.push(id);
        socket.emit("seleccionar-carta", { carta: id, sala: salaActual });
        if (seleccionadas.length === 2) btnIniciar.style.display = "block";
      }
    }

    btnIniciar.onclick = () => {
      cambiarPantalla("juego");
      seleccionadas.forEach(id => {
        const contenedor = document.createElement("div");
        contenedor.classList.add("carta-juego");
        contenedor.innerHTML = `<img src="${id}.jpg">`;
        contenedor.onclick = e => marcarFicha(e, contenedor);
        juegoCartas.appendChild(contenedor);
      });
    };

    function marcarFicha(e, contenedor) {
      const img = contenedor.querySelector("img");
      const bounds = img.getBoundingClientRect();
      const x = e.clientX - bounds.left;
      const y = e.clientY - bounds.top;
      const px = (x / bounds.width) * 100;
      const py = (y / bounds.height) * 100;
      const ficha = document.createElement("img");
      ficha.src = "ficha.PNG";
      ficha.classList.add("ficha");
      ficha.style.left = `${px}%`;
      ficha.style.top = `${py}%`;
      contenedor.appendChild(ficha);
    }

    function limpiarFichas() {
      document.querySelectorAll(".ficha").forEach(f => f.remove());
    }

    function emitirLoteria() {
      socket.emit("loteria", { nickname, sala: salaActual });
    }

    socket.on("cartas-desactivadas", ids => {
      document.querySelectorAll(".carta-img").forEach(img => {
        if (ids.includes(img.dataset.id)) {
          img.style.opacity = 0.3;
          img.style.pointerEvents = "none";
        }
      });
    });

    socket.on("historial-actualizado", historialRecibido => {
      historial.innerHTML = "";
      historialRecibido.forEach(id => {
        const img = document.createElement("img");
        img.src = `${id}.png`;
        historial.appendChild(img);
      });
    });

    socket.on("jugadores-actualizados", jugadores => {
      jugadoresLista.innerHTML = "<h3>Jugadores conectados:</h3>" +
        Object.values(jugadores).map(j => `<div>${j.nickname}</div>`).join("");
    });

    // Sonidos sincronizados con eventos del host
    socket.on("campana", () => {
      if (soyHost) audioCampana.play();
    });

    socket.on("corre", () => {
      if (soyHost) audioCorre.play();
    });

    socket.on("carta-cantada", () => {
      if (soyHost) audioCarta.play();
    });

    socket.on("loteria-anunciada", nombre => {
      if (soyHost) audioAplausos.play();
      alert(`${nombre} ha cantado ¡Lotería!`);
    });

    socket.on("partida-reiniciada", () => {
      location.reload();
    });
  </script>
</body>
</html>
