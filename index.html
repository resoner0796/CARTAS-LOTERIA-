<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería WebApp</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }

    .pantalla {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background-size: cover;
      background-position: center;
    }

    .pantalla.activa {
      display: flex;
    }

    #pantallaSplash {
      background-image: url("splash.PNG");
      justify-content: center;
      position: relative;
    }

    #loader {
      position: absolute;
      bottom: 3%;
      width: 30px;
      height: 30px;
      border: 4px solid #fff;
      border-top: 4px solid gold;
      border-radius: 50%;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .cartas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .carta-img {
      width: 180px;
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
      position: relative;
    }

    .carta-img.seleccionada {
      transform: scale(1.05);
      box-shadow: 0 0 15px gold;
      border-color: gold;
    }

    .carta-img.tachada::after {
      content: "❌";
      font-size: 4rem;
      color: red;
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: gold;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    .juego-cartas {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: center;
    }

    .carta-juego {
      position: relative;
      width: 250px;
      box-shadow: 0 0 20px 5px gold;
      border-radius: 10px;
    }

    .carta-juego img {
      width: 100%;
      border-radius: 10px;
    }

    .ficha {
      position: absolute;
      pointer-events: none;
      width: 40px;
      height: auto;
      transform: translate(-50%, -50%);
    }

    #historialContainer {
      width: 90%;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      margin-top: 1rem;
      padding: 0.5rem;
      border: 1px solid #fff;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.5);
    }

    #historial {
      display: flex;
      gap: 5px;
    }

    #historial img {
      width: 40px;
      height: auto;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="pantallaSplash" class="pantalla activa">
    <div id="loader"></div>
  </div>

  <div id="pantallaNickname" class="pantalla">
    <h2>Ingresa tu nickname</h2>
    <input type="text" id="nicknameInput" placeholder="Tu nombre..." />
    <button onclick="entrarJuego()">Entrar</button>
  </div>

  <div id="pantallaSeleccion" class="pantalla" style="background-image: url('fondo-seleccion.PNG');">
    <h1>Selecciona tus 2 cartas</h1>
    <div class="cartas-container" id="contenedorCartas"></div>
    <button id="btnIniciar" style="display:none">Continuar</button>
  </div>

  <div id="pantallaJuego" class="pantalla" style="background-image: url('fondo-juego.PNG');">
    <h2>Tu juego</h2>
    <div class="juego-cartas" id="juegoCartas"></div>
    <div>
      <button onclick="limpiarFichas()">Limpiar cartas</button>
      <button id="btnBarajear" onclick="emitirBarajear()">Barajear</button>
      <button id="btnIniciarJuego" onclick="emitirIniciarJuego()">Iniciar juego</button>
      <button id="btnDetenerJuego" onclick="emitirDetenerJuego()">Detener juego</button>
      <button onclick="emitirLoteria()">Lotería</button>
      <button id="btnReiniciar" onclick="emitirReiniciar()">Reiniciar partida</button>
    </div>
    <div id="historialContainer">
      <div id="historial"></div>
    </div>
  </div>

  <script src="https://loteria-backend-3nde.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://loteria-backend-3nde.onrender.com");

    let nickname = "";
    let soyHost = false;
    let seleccionadas = [];
    const cartasDisponibles = Array.from({ length: 54 }, (_, i) => String(i + 1).padStart(2, '0'));

    const splash = document.getElementById("pantallaSplash");
    const nicknameDiv = document.getElementById("pantallaNickname");
    const pantallaSeleccion = document.getElementById("pantallaSeleccion");
    const pantallaJuego = document.getElementById("pantallaJuego");
    const contenedorCartas = document.getElementById("contenedorCartas");
    const juegoCartas = document.getElementById("juegoCartas");
    const btnIniciar = document.getElementById("btnIniciar");
    const historial = document.getElementById("historial");

    window.onload = () => {
      setTimeout(() => {
        splash.classList.remove("activa");
        nicknameDiv.classList.add("activa");
      }, 2000);
    };

    function entrarJuego() {
      nickname = document.getElementById("nicknameInput").value.trim();
      if (!nickname) return alert("Escribe tu nombre");
      socket.emit("registrar-nickname", nickname);
    }

    socket.on("rol-asignado", ({ host }) => {
      soyHost = host;
      nicknameDiv.classList.remove("activa");
      pantallaSeleccion.classList.add("activa");
      generarCartas();
      if (!soyHost) {
        document.getElementById("btnBarajear").style.display = "none";
        document.getElementById("btnIniciarJuego").style.display = "none";
        document.getElementById("btnDetenerJuego").style.display = "none";
        document.getElementById("btnReiniciar").style.display = "none";
      }
    });

    function generarCartas() {
      contenedorCartas.innerHTML = "";
      cartasDisponibles.forEach(carta => {
        const img = document.createElement("img");
        img.src = `${carta}.jpg`;
        img.classList.add("carta-img");
        img.dataset.id = carta;
        img.onclick = () => seleccionarCarta(img);
        contenedorCartas.appendChild(img);
      });
    }

    socket.on("cartas-desactivadas", (desactivadas) => {
      document.querySelectorAll(".carta-img").forEach(img => {
        if (desactivadas.includes(img.dataset.id)) {
          img.style.opacity = "0.3";
          img.style.pointerEvents = "none";
        }
      });
    });

    function seleccionarCarta(img) {
      const id = img.dataset.id;
      if (seleccionadas.includes(id)) return;
      if (seleccionadas.length < 2) {
        img.classList.add("seleccionada");
        seleccionadas.push(id);
        socket.emit("seleccionar-carta", id);
        if (seleccionadas.length === 2) btnIniciar.style.display = "block";
      }
    }

    btnIniciar.onclick = () => {
      pantallaSeleccion.classList.remove("activa");
      pantallaJuego.classList.add("activa");
      seleccionadas.forEach(id => {
        const contenedor = document.createElement("div");
        contenedor.classList.add("carta-juego");
        contenedor.innerHTML = `<img src="${id}.jpg">`;
        contenedor.onclick = e => marcarFicha(e, contenedor);
        juegoCartas.appendChild(contenedor);
      });
    };

    function marcarFicha(e, contenedor) {
      const img = contenedor.querySelector("img");
      const bounds = img.getBoundingClientRect();
      const x = e.clientX - bounds.left;
      const y = e.clientY - bounds.top;
      const px = (x / bounds.width) * 100;
      const py = (y / bounds.height) * 100;
      const ficha = document.createElement("img");
      ficha.src = "ficha.PNG";
      ficha.classList.add("ficha");
      ficha.style.left = `${px}%`;
      ficha.style.top = `${py}%`;
      contenedor.appendChild(ficha);
    }

    function limpiarFichas() {
      document.querySelectorAll(".ficha").forEach(f => f.remove());
    }

    function reproducirSonido(nombre) {
      const audio = new Audio(nombre);
      audio.play();
    }

    function emitirBarajear() {
      socket.emit("barajear");
    }

    function emitirIniciarJuego() {
      socket.emit("iniciar-juego");
    }

    function emitirDetenerJuego() {
      socket.emit("detener-juego");
    }

    function emitirLoteria() {
      socket.emit("loteria", nickname);
    }

    function emitirReiniciar() {
      location.reload(); // Reinicia todo desde el inicio
    }

    socket.on("barajear", () => {
      historial.innerHTML = "";
      reproducirSonido("barajar.mp3");
    });

    socket.on("carta-cantada", (nombre) => {
      const img = document.createElement("img");
      img.src = `${nombre}.png`;
      historial.appendChild(img);
      reproducirSonido(`${nombre}.mp3`);
    });

    socket.on("historial-actualizado", (historialCartas) => {
      historial.innerHTML = "";
      historialCartas.forEach(nombre => {
        const img = document.createElement("img");
        img.src = `${nombre}.png`;
        historial.appendChild(img);
      });
    });

    socket.on("juego-detenido", () => {
      reproducirSonido("aplausos.mp3");
    });

    socket.on("loteria-anunciada", (ganador) => {
      alert(`¡${ganador} ha cantado LOTERÍA!`);
    });
  </script>
</body>
</html>
