<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lotería WebApp</title>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }
    .pantalla {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background-size: cover;
      background-position: center;
      animation: fadein 0.5s ease-in;
    }
    .pantalla.activa {
      display: flex;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #pantallaSplash { background-image: url("splash.PNG"); }
    #pantallaSala, #pantallaNickname { background-color: #222; }
    #pantallaSeleccion { background-image: url("fondo-seleccion.PNG"); }
    #pantallaJuego { background-image: url("fondo-juego.PNG"); }
    .cartas-container, .juego-cartas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .carta-img {
      width: 180px;
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .carta-img.seleccionada {
      transform: scale(1.05);
      box-shadow: 0 0 15px gold;
      border-color: gold;
    }
    .carta-juego {
      position: relative;
      width: 250px;
    }
    .carta-juego img {
      width: 100%;
    }
    .ficha {
      position: absolute;
      pointer-events: none;
      width: 40px;
      transform: translate(-50%, -50%);
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: gold;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }
    #historial {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      padding: 0 1rem;
      max-width: 90vw;
      white-space: nowrap;
    }
    #historial img {
      width: 40px;
      border-radius: 5px;
    }
    #jugadoresLista {
      margin-top: 1rem;
      font-size: 1rem;
    }
    #loteriaMensaje {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      color: gold;
      font-weight: bold;
      background-color: rgba(0,0,0,0.7);
      padding: 20px 40px;
      border-radius: 20px;
      z-index: 9999;
      display: none;
      user-select: none;
    }
    .confeti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: gold;
      z-index: 9998;
      animation: caer 2s linear forwards;
      border-radius: 50%;
    }
    @keyframes caer {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }
    @media screen and (orientation: landscape) {
      .juego-cartas {
        flex-wrap: nowrap;
        flex-direction: row;
        justify-content: center;
      }
      .juego-cartas .carta-juego {
        width: 30vw;
        max-width: 180px;
      }
      .juego-cartas .carta-juego img {
        width: 100%;
        height: auto;
      }
    }
    .apuesta-container {
      display: flex;
      align-items: center;
      margin-top: 1rem;
    }
    #monedasDisponibles {
      font-size: 1.2rem;
      margin-right: 1rem;
      font-weight: bold;
      color: gold;
    }
    #apuestaInput {
      width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- ... tus pantallas ... -->
  <div id="pantallaJuego" class="pantalla">
    <h2>Tu juego</h2>
    <div class="juego-cartas" id="juegoCartas"></div>
    <div>
      <button onclick="limpiarFichas()">Limpiar cartas</button>
      <button id="btnBarajear" onclick="socket.emit('barajear', salaActual)">Barajear</button>
      <button id="btnIniciarJuego" onclick="socket.emit('iniciar-juego', salaActual)">Iniciar juego</button>
      <button id="btnDetenerJuego" onclick="socket.emit('detener-juego', salaActual)">Detener juego</button>
      <button id="btnReiniciar" onclick="socket.emit('reiniciar-partida', salaActual)">Reiniciar partida</button>
      <button onclick="emitirLoteria()">Lotería</button>
    </div>
    <div class="apuesta-container">
      <span id="monedasDisponibles">Monedas: 100</span>
      <input type="number" id="apuestaInput" placeholder="Apuesta" min="1" max="100" />
      <button onclick="apostar()">Apostar</button>
    </div>
    <div id="historial"></div>
    <div id="jugadoresLista"></div>
  </div>

  <!-- ... tu resto de HTML y scripts ... -->

  <script>
    let monedas = 100;

    function apostar() {
      const cantidad = parseInt(document.getElementById("apuestaInput").value);
      if (isNaN(cantidad) || cantidad <= 0 || cantidad > monedas) {
        alert("Cantidad no válida para apostar");
        return;
      }
      monedas -= cantidad;
      document.getElementById("monedasDisponibles").textContent = `Monedas: ${monedas}`;
      socket.emit("apostar", { nickname, sala: salaActual, cantidad });
    }
  </script>
</body>
</html>
