<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería Interactiva</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }

    html, body {
      scroll-behavior: smooth;
    }

    #pantallaInicio, #pantallaJuego {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }

    #pantallaInicio.active, #pantallaJuego.active {
      display: flex;
    }

    .cartas {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .cartas img {
      width: 160px;
      height: auto;
      cursor: pointer;
      border: 3px solid transparent;
      transition: 0.3s;
    }

    .cartas img.seleccionada {
      border: 3px solid gold;
      transform: scale(1.05);
    }

    #btnIniciar {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1.2rem;
      background: gold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }

    .cartaJuego {
      position: relative;
      margin: 10px;
    }

    .cartaJuego img {
      width: 300px;
      height: auto;
    }

    .ficha {
      position: absolute;
      width: 35px;
      height: 35px;
      pointer-events: none;
    }

    .tituloCarta {
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 5px;
    }

    #btnLimpiar {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: crimson;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="pantallaInicio" class="active">
  <h1>Selecciona tus 2 cartas</h1>
  <div class="cartas" id="seleccionCartas">
    <!-- Se generan desde JS -->
  </div>
  <button id="btnIniciar" onclick="iniciarJuego()">Iniciar Juego</button>
</div>

<div id="pantallaJuego">
  <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
    <div class="cartaJuego" id="carta1Container">
      <div class="tituloCarta">Carta 1</div>
      <img id="carta1" src="" onclick="colocarFicha(event, 1)">
    </div>
    <div class="cartaJuego" id="carta2Container">
      <div class="tituloCarta">Carta 2</div>
      <img id="carta2" src="" onclick="colocarFicha(event, 2)">
    </div>
  </div>
  <button id="btnLimpiar" onclick="limpiarFichas()">Limpiar Fichas</button>
</div>

<script>
let cartasSeleccionadas = [];

function crearPantallaInicio() {
  const contenedor = document.getElementById("seleccionCartas");
  for (let i = 1; i <= 10; i++) {
    const img = document.createElement("img");
    img.src = `${String(i).padStart(2, '0')}.jpg`;
    img.alt = `Carta ${i}`;
    img.onclick = () => seleccionarCarta(img, i);
    contenedor.appendChild(img);
  }
}

function seleccionarCarta(img, num) {
  if (cartasSeleccionadas.includes(num)) {
    cartasSeleccionadas = cartasSeleccionadas.filter(n => n !== num);
    img.classList.remove("seleccionada");
  } else if (cartasSeleccionadas.length < 2) {
    cartasSeleccionadas.push(num);
    img.classList.add("seleccionada");
  }

  document.getElementById("btnIniciar").style.display =
    cartasSeleccionadas.length === 2 ? "inline-block" : "none";
}

function iniciarJuego() {
  window.scrollTo(0, 0);
  document.getElementById("pantallaInicio").classList.remove("active");
  document.getElementById("pantallaJuego").classList.add("active");

  document.getElementById("carta1").src = `${String(cartasSeleccionadas[0]).padStart(2, '0')}.jpg`;
  document.getElementById("carta2").src = `${String(cartasSeleccionadas[1]).padStart(2, '0')}.jpg`;
}

function colocarFicha(event, cartaNum) {
  const img = event.target;
  const rect = img.getBoundingClientRect();
  const offsetX = event.clientX - rect.left;
  const offsetY = event.clientY - rect.top;

  const ficha = document.createElement("img");
  ficha.src = "ficha.png";
  ficha.className = "ficha";
  ficha.style.left = `${offsetX - 17}px`;
  ficha.style.top = `${offsetY - 17}px`;

  document.getElementById(`carta${cartaNum}Container`).appendChild(ficha);
}

function limpiarFichas() {
  document.querySelectorAll(".ficha").forEach(f => f.remove());
}

crearPantallaInicio();
</script>

</body>
</html>
