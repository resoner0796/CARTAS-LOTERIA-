<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  
  <link rel="apple-touch-icon" href="assets/imagenes/ui/icon-192.png">
  <title>Lotería WebApp</title>
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos rápidos para las nuevas pantallas de auth (puedes moverlos a style.css luego) */
    .auth-container, .menu-acciones, .sala-box {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .auth-container input, .sala-box input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2d3e50;
      color: white;
      font-size: 1rem;
    }
    .stats-resumen {
      font-size: 2rem;
      margin: 1rem 0;
      color: gold;
    }
    .sala-box {
      background: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }
    a { color: #4dd0e1; text-decoration: none; }
  </style>
</head>
<body>
  <div id="pantallaSplash" class="pantalla activa"><h1>Cargando...</h1></div>
  
  <div id="pantallaLogin" class="pantalla">
    <div class="auth-container">
        <h2>Iniciar Sesión</h2>
        <input type="email" id="loginEmail" placeholder="Correo electrónico">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <p>¿No tienes cuenta? <a href="#" onclick="cambiarPantalla('registro')">Regístrate aquí</a></p>
    </div>
  </div>

  <div id="pantallaRegistro" class="pantalla">
    <div class="auth-container">
        <h2>Crear Cuenta</h2>
        <input type="text" id="regNickname" placeholder="Tu Nickname (Apodo)">
        <input type="email" id="regEmail" placeholder="Correo electrónico">
        <input type="password" id="regPass" placeholder="Contraseña">
        <button onclick="registro()">Registrarme</button>
        <p>¿Ya tienes cuenta? <a href="#" onclick="cambiarPantalla('login')">Inicia sesión</a></p>
    </div>
  </div>

  <div id="pantallaMenu" class="pantalla">
    <h1 id="menuBienvenida">Hola, Jugador</h1>
    <div class="stats-resumen">
        <span id="menuMonedas">💰 0</span>
    </div>
    
    <div class="menu-acciones">
        <div class="sala-box">
            <h3>Crear Sala</h3>
            <p>Ponle nombre a tu mesa:</p>
            <input type="text" id="inputCrearSala" placeholder="Ej: Familia Perez">
            <button onclick="crearSalaPropia()">Crear y Jugar</button>
        </div>
        
        <div class="sala-box">
            <h3>Unirse a Sala</h3>
            <p>Ingresa el nombre exacto:</p>
            <input type="text" id="inputUnirseSala" placeholder="Nombre de sala">
            <button onclick="unirseSalaExistente()">Unirse</button>
        </div>
    </div>
    
    <button onclick="cerrarSesion()" style="background-color: #dc3545; margin-top: 2rem;">Cerrar Sesión</button>
  </div>

  <div id="pantallaSala" class="pantalla">
    <h2 id="tituloSalaActual">Sala: ...</h2>
    
    <div class="sala-box">
        <p>¡Invita a más jugadores!</p>
        <button onclick="compartirSala()" id="btnCompartir" style="background-color: #4dd0e1; color: #000;">🔗 Compartir Enlace</button>
    </div>

    <button onclick="cambiarPantalla('seleccion')" style="background-color: gold; color: black; font-weight: bold; margin-top: 10px;">Elegir Cartas 🎴</button>
    
    <div id="jugadoresLista" style="width: 100%; margin-top: 20px;"></div>
    
    <button id="btnSalirSala" style="background-color: #dc3545; margin-top: 20px;">Salir al Menú</button>
  </div>

  <div id="pantallaSeleccion" class="pantalla">
    <h1>Selecciona tus cartas</h1>
    <div class="cartas-container" id="contenedorCartas"></div>
    <button id="btnIniciar" style="display:none">Continuar</button>
  </div>

  <div id="pantallaJuego" class="pantalla">
    <div class="historial-container">
      <div id="historial"></div>
    </div>
    <div class="juego-cartas" id="juegoCartas"></div>
    
    <div style="display:flex; flex-wrap: wrap; justify-content: center;">
      <button id="btnLimpiarCartas" onclick="limpiarFichas()">Limpiar cartas</button>
      <button id="btnBarajear" onclick="socket.emit('barajear', salaActual)">Barajear</button>
      <button id="btnIniciarJuego" onclick="socket.emit('iniciar-juego', salaActual)">Iniciar juego</button>
      <button id="btnDetenerJuego" onclick="socket.emit('detener-juego', salaActual)">Detener juego</button>
      <button id="btnCambiarCartas" onclick="cambiarCartas()">Cambiar Cartas</button>
      <button id="btnLoteria" onclick="emitirLoteria()">Lotería</button>
      <button onclick="salirDeSalaEnJuego()" style="background-color: #dc3545; color: white;">Salir</button>
    </div>
    
    <div id="apuestasUI">
      <div class="saldo-jugador">
          <div style="display:flex;align-items:flex-end;">
              <div class="monedas-apiladas">
                  <img src="assets/imagenes/ui/peso.png" alt="peso" class="moneda-stack">
                  <img src="assets/imagenes/ui/peso.png" alt="peso" class="moneda-stack">
                  <img src="assets/imagenes/ui/peso.png" alt="peso" class="moneda-stack">
              </div>
          </div>
          <strong id="monedas-valor">30</strong>
      </div>
      <div class="apuesta-control">
          <div class="bote-monedas">
              <img src="assets/imagenes/ui/peso.png" alt="moneda">
              <img src="assets/imagenes/ui/peso.png" alt="moneda">
              <img src="assets/imagenes/ui/peso.png" alt="moneda">
              <strong id="bote-valor">0</strong>
          </div>
          <span style="font-weight:600;font-size:0.8rem">Bote</span>
          <button id="btnApostar">Apostar</button>
      </div>
    </div>
    
    <div id="jugadoresListaIngame" style="margin-top: 1.5rem; font-size: 1rem; text-align: center; background-color: #2d3e50; padding: 0.8rem; border-radius: 8px;"></div>
  </div>

  <div id="loteriaMensaje">¡LOTERÍA!</div>

  <div id="loteriaModal" class="modal">
    <div class="modal-content">
      <h2 id="modalLoteriaTitulo"></h2>
      <p id="modalLoteriaTexto"></p>
      <div id="modalVerificationArea" class="juego-cartas" style="margin-top: 1rem; margin-bottom: 1rem; transform: scale(0.8); gap: 0.8rem;"></div>
      <div class="modal-buttons">
        <button id="btnAceptarGanador">Aceptar</button>
        <button id="btnRechazarGanador">Rechazar</button>
      </div>
    </div>
  </div>

  <audio id="audioBarajear" src="assets/audios/barajar.mp3"></audio>
  <audio id="audioCampana" src="assets/audios/campana.mp3"></audio>
  <audio id="audioCorre" src="assets/audios/corre.mp3"></audio>
  <audio id="audioAplausos" src="assets/audios/aplausos.mp3"></audio>

  <script src="https://loteria-backend-3nde.onrender.com/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
