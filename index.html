<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería WebApp</title>
  <style>
    /* ... tus estilos anteriores sin cambios ... */

    #nicknameOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    #nicknameOverlay input {
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 5px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div id="nicknameOverlay">
  <h2>Ingresa tu nombre:</h2>
  <input type="text" id="nicknameInput" placeholder="Ej. Uli" />
  <button onclick="registrarJugador()">Entrar</button>
</div>

<!-- Pantallas existentes aquí: selección, juego, historial, etc. -->
<!-- No se modifica nada de tu estructura visual -->

<script>
  const socket = io("https://loteria-backend-3nde.onrender.com");

  let nickname = "";
  let esHost = false;

  function registrarJugador() {
    const input = document.getElementById("nicknameInput");
    nickname = input.value.trim();
    if (!nickname) return alert("Ingresa un nombre válido");

    document.getElementById("nicknameOverlay").style.display = "none";
    socket.emit("nuevo-jugador", nickname);
  }

  socket.on("rol-asignado", (rol) => {
    esHost = rol === "host";
    console.log("Soy:", esHost ? "HOST" : "JUGADOR");

    if (!esHost) {
      document.querySelector("button[onclick='barajearCartas()']").style.display = "none";
      document.querySelector("button[onclick='iniciarBarajeo()']").style.display = "none";
      document.querySelector("button[onclick='detenerJuego()']").style.display = "none";
    }
  });

  // Emitir al resto cuando se presiona iniciar o barajear:
  function barajearCartas() {
    mezcladas = Array.from({ length: 54 }, (_, i) => String(i + 1).padStart(2, '0')).sort(() => Math.random() - 0.5);
    index = 0;
    historial.innerHTML = '';
    reproducirSonido("barajar.mp3");
    socket.emit("barajear", mezcladas);
  }

  function iniciarBarajeo() {
    reproducirSonido("campana.mp3");
    reproducirSonido("corre.mp3");

    intervalo = setInterval(() => {
      if (index < mezcladas.length) {
        const nombre = mezcladas[index];
        mostrarEnHistorial(nombre);
        reproducirSonido(`${nombre}.mp3`);
        socket.emit("cantar", nombre);
        index++;
      } else {
        detenerJuego();
      }
    }, tiempo);
  }

  function detenerJuego() {
    clearInterval(intervalo);
    reproducirSonido("aplausos.mp3");
    socket.emit("detener");
  }

  // Recibir baraja o canto de otros:
  socket.on("actualizar-baraja", (orden) => {
    mezcladas = orden;
    index = 0;
    historial.innerHTML = '';
  });

  socket.on("nueva-carta", (nombre) => {
    mostrarEnHistorial(nombre);
    reproducirSonido(`${nombre}.mp3`);
  });

  socket.on("detener", () => {
    clearInterval(intervalo);
    reproducirSonido("aplausos.mp3");
  });

</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-3GtZ4Y2ZyRoqK+spS5GdoEsyYy3c65xOvb1e6lzHdyyS1mlFQvWzvRz7JKWxwrYx" crossorigin="anonymous"></script>
</body>
</html>
