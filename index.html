<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería WebApp</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #000;
      color: white;
    }

    .pantalla {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      padding: 1rem;
    }

    .pantalla.activa {
      display: flex;
    }

    #pantallaSplash {
      background-image: url("splash.PNG");
      justify-content: center;
      position: relative;
    }

    #loader {
      position: absolute;
      bottom: 3%;
      width: 30px;
      height: 30px;
      border: 4px solid #fff;
      border-top: 4px solid gold;
      border-radius: 50%;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    input {
      padding: 0.6rem;
      font-size: 1rem;
      border-radius: 5px;
      margin: 0.5rem 0;
      border: none;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 10px;
      margin: 0.5rem;
      border: none;
      background-color: gold;
      font-weight: bold;
      cursor: pointer;
    }

    .cartas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .carta-img {
      width: 160px;
      border: 2px solid #fff;
      border-radius: 10px;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .carta-img.seleccionada {
      transform: scale(1.1);
      border-color: gold;
      box-shadow: 0 0 15px gold;
    }

    .carta-img.tachada::after {
      content: "❌";
      font-size: 4rem;
      color: red;
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .juego-cartas {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .carta-juego {
      position: relative;
      width: 200px;
    }

    .carta-juego img {
      width: 100%;
    }

    .ficha {
      position: absolute;
      pointer-events: none;
      width: 40px;
      transform: translate(-50%, -50%);
    }

    #historial {
      display: flex;
      overflow-x: auto;
      max-width: 90vw;
      padding: 10px;
      margin-top: 1rem;
      gap: 5px;
      border: 1px solid gold;
      border-radius: 10px;
      background: rgba(255, 215, 0, 0.1);
    }

    #historial img {
      width: 50px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="pantallaSplash" class="pantalla activa">
    <div id="loader"></div>
  </div>

  <!-- Nickname -->
  <div id="pantallaNickname" class="pantalla">
    <h2>Ingresa tu nickname</h2>
    <input id="nicknameInput" placeholder="Tu nombre..." />
    <button onclick="entrarJuego()">Entrar</button>
  </div>

  <!-- Selección -->
  <div id="pantallaSeleccion" class="pantalla" style="background-image: url('fondo-seleccion.PNG');">
    <h2>Selecciona tus 2 cartas</h2>
    <div class="cartas-container" id="contenedorCartas"></div>
    <button id="btnContinuar" style="display:none;">Continuar</button>
  </div>

  <!-- Juego -->
  <div id="pantallaJuego" class="pantalla" style="background-image: url('fondo-juego.PNG');">
    <h2>Tu juego</h2>
    <div class="juego-cartas" id="juegoCartas"></div>
    <div>
      <button onclick="limpiarFichas()">Limpiar cartas</button>
      <button onclick="emitirLoteria()">Lotería</button>
      <button id="btnBarajear" onclick="socket.emit('barajear')">Barajear</button>
      <button id="btnIniciarJuego" onclick="socket.emit('iniciar-juego')">Iniciar juego</button>
      <button id="btnDetenerJuego" onclick="socket.emit('detener-juego')">Detener</button>
      <button id="btnReiniciar" onclick="socket.emit('reiniciar-partida')">Reiniciar partida</button>
    </div>
    <div id="historial"></div>
  </div>

  <script src="https://loteria-backend-3nde.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://loteria-backend-3nde.onrender.com");

    let nickname = "";
    let soyHost = false;
    const seleccionadas = [];
    const cartasDisponibles = Array.from({ length: 10 }, (_, i) => String(i + 1).padStart(2, '0'));

    const splash = document.getElementById("pantallaSplash");
    const nicknameDiv = document.getElementById("pantallaNickname");
    const seleccionDiv = document.getElementById("pantallaSeleccion");
    const juegoDiv = document.getElementById("pantallaJuego");
    const contenedorCartas = document.getElementById("contenedorCartas");
    const juegoCartas = document.getElementById("juegoCartas");
    const btnContinuar = document.getElementById("btnContinuar");
    const historial = document.getElementById("historial");
    const btnBarajear = document.getElementById("btnBarajear");
    const btnIniciarJuego = document.getElementById("btnIniciarJuego");
    const btnDetenerJuego = document.getElementById("btnDetenerJuego");
    const btnReiniciar = document.getElementById("btnReiniciar");

    window.onload = () => {
      setTimeout(() => {
        splash.classList.remove("activa");
        nicknameDiv.classList.add("activa");
      }, 1500);
    };

    function entrarJuego() {
      const input = document.getElementById("nicknameInput");
      if (!input.value.trim()) return alert("Escribe tu nombre");
      nickname = input.value.trim();
      socket.emit("registrar-nickname", nickname);
    }

    socket.on("rol-asignado", ({ host }) => {
      soyHost = host;
      nicknameDiv.classList.remove("activa");
      seleccionDiv.classList.add("activa");
      if (!soyHost) {
        btnBarajear.style.display = "none";
        btnIniciarJuego.style.display = "none";
        btnDetenerJuego.style.display = "none";
        btnReiniciar.style.display = "none";
      }
      generarCartas();
    });

    function generarCartas() {
      contenedorCartas.innerHTML = "";
      cartasDisponibles.forEach(id => {
        const img = document.createElement("img");
        img.src = `${id}.jpg`;
        img.className = "carta-img";
        img.dataset.id = id;
        img.onclick = () => seleccionarCarta(img);
        contenedorCartas.appendChild(img);
      });
    }

    function seleccionarCarta(img) {
      const id = img.dataset.id;
      if (seleccionadas.includes(id) || seleccionadas.length >= 2) return;
      seleccionadas.push(id);
      img.classList.add("seleccionada");
      img.onclick = null;
      socket.emit("seleccionar-carta", id);
      if (seleccionadas.length === 2) btnContinuar.style.display = "block";
    }

    btnContinuar.onclick = () => {
      seleccionDiv.classList.remove("activa");
      juegoDiv.classList.add("activa");
      seleccionadas.forEach(id => {
        const cont = document.createElement("div");
        cont.className = "carta-juego";
        cont.innerHTML = `<img src="${id}.jpg">`;
        cont.onclick = e => marcarFicha(e, cont);
        juegoCartas.appendChild(cont);
      });
    };

    function marcarFicha(e, contenedor) {
      const img = contenedor.querySelector("img");
      const bounds = img.getBoundingClientRect();
      const x = e.clientX - bounds.left;
      const y = e.clientY - bounds.top;
      const px = (x / bounds.width) * 100;
      const py = (y / bounds.height) * 100;
      const ficha = document.createElement("img");
      ficha.src = "ficha.PNG";
      ficha.classList.add("ficha");
      ficha.style.left = `${px}%`;
      ficha.style.top = `${py}%`;
      contenedor.appendChild(ficha);
    }

    function limpiarFichas() {
      document.querySelectorAll(".ficha").forEach(f => f.remove());
    }

    function emitirLoteria() {
      socket.emit("loteria", nickname);
    }

    function reproducirSonido(nombre) {
      const audio = new Audio(nombre);
      audio.play();
    }

    // SOCKET LISTENERS

    socket.on("cartas-desactivadas", cartas => {
      document.querySelectorAll(".carta-img").forEach(img => {
        if (cartas.includes(img.dataset.id)) {
          img.style.opacity = 0.3;
          img.onclick = null;
        }
      });
    });

    socket.on("barajear", () => {
      historial.innerHTML = "";
      reproducirSonido("barajar.mp3");
    });

    socket.on("carta-cantada", nombre => {
      const img = document.createElement("img");
      img.src = `${nombre}.png`;
      historial.appendChild(img);
      reproducirSonido(`${nombre}.mp3`);
    });

    socket.on("iniciar-cantada", () => {
      reproducirSonido("campana.mp3");
      setTimeout(() => {
        reproducirSonido("corre.mp3");
      }, 1500);
    });

    socket.on("juego-detenido", () => {
      reproducirSonido("aplausos.mp3");
    });

    socket.on("loteria-anunciada", ganador => {
      alert(`¡${ganador} ha cantado Lotería!`);
    });

    socket.on("reiniciar-cliente", () => {
      location.reload();
    });
  </script>
</body>
</html>
