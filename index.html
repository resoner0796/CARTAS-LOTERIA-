<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotería WebApp</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }

    .pantalla {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-y: auto;
      padding: 1rem;
    }

    .pantalla.activa {
      display: flex;
    }

    .cartas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .carta-img {
      width: 180px;
      border: 3px solid #fff;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
    }

    .carta-img.seleccionada {
      box-shadow: 0 0 15px gold;
      border-color: gold;
    }

    .carta-img.deshabilitada {
      opacity: 0.3;
      pointer-events: none;
    }

    .juego-cartas {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: center;
    }

    .carta-juego {
      position: relative;
      width: 250px;
    }

    .carta-juego img {
      width: 100%;
      box-shadow: 0 0 15px gold;
    }

    .ficha {
      position: absolute;
      pointer-events: none;
      width: 40px;
      height: auto;
      max-width: 40px;
      max-height: 40px;
      transform: translate(-50%, -50%);
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem;
      border-radius: 10px;
      border: none;
      background-color: gold;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    #historial {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      margin-top: 1rem;
      max-width: 90vw;
    }

    #historial img {
      width: 40px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- Pantalla de inicio para nickname -->
  <div id="pantallaNickname" class="pantalla activa">
    <h2>Ingresa tu nickname</h2>
    <input type="text" id="inputNickname" placeholder="Tu apodo" />
    <button onclick="registrarJugador()">Entrar</button>
  </div>

  <!-- Pantalla de selección -->
  <div id="pantallaSeleccion" class="pantalla">
    <h1>Selecciona tus 2 cartas</h1>
    <div class="cartas-container" id="contenedorCartas"></div>
    <button id="btnIniciar" style="display:none">Iniciar juego</button>
  </div>

  <!-- Pantalla de juego -->
  <div id="pantallaJuego" class="pantalla">
    <h2>Tu juego</h2>
    <div class="juego-cartas" id="juegoCartas"></div>
    <div id="controlesHost" style="display:none">
      <button onclick="barajearCartas()">Barajear</button>
      <button onclick="iniciarBarajeo()">Iniciar juego</button>
      <button onclick="detenerJuego()">Detener juego</button>
    </div>
    <div>
      <button onclick="limpiarFichas()">Limpiar cartas</button>
      <button onclick="gritarLoteria()">¡Lotería!</button>
    </div>
    <div id="historial"></div>
  </div>

  <script>
    const socket = io("https://loteria-backend-3nde.onrender.com"); // <--- tu servidor render aquí

    const cartasDisponibles = Array.from({ length: 10 }, (_, i) => String(i + 1).padStart(2, '0'));
    const seleccionadas = [];
    let mezcladas = [];
    let index = 0;
    let intervalo;
    let nickname = "";
    const tiempo = 4000;

    const pantallaNickname = document.getElementById("pantallaNickname");
    const pantallaSeleccion = document.getElementById("pantallaSeleccion");
    const pantallaJuego = document.getElementById("pantallaJuego");
    const contenedorCartas = document.getElementById("contenedorCartas");
    const juegoCartas = document.getElementById("juegoCartas");
    const btnIniciar = document.getElementById("btnIniciar");
    const historial = document.getElementById("historial");
    const controlesHost = document.getElementById("controlesHost");

    cartasDisponibles.forEach(carta => {
      const img = document.createElement("img");
      img.src = `${carta}.jpg`;
      img.classList.add("carta-img");
      img.dataset.id = carta;
      img.onclick = () => seleccionarCarta(img);
      contenedorCartas.appendChild(img);
    });

    function registrarJugador() {
      nickname = document.getElementById("inputNickname").value.trim();
      if (!nickname) return alert("Ingresa un nickname");

      socket.emit("registrarJugador", nickname);
      pantallaNickname.classList.remove("activa");
      pantallaSeleccion.classList.add("activa");
    }

    function seleccionarCarta(img) {
      const id = img.dataset.id;
      if (seleccionadas.length >= 2 || img.classList.contains("deshabilitada")) return;

      img.classList.add("seleccionada");
      seleccionadas.push(id);

      if (seleccionadas.length === 2) {
        btnIniciar.style.display = "block";
        socket.emit("cartasSeleccionadas", seleccionadas);
      }
    }

    btnIniciar.onclick = () => {
      pantallaSeleccion.classList.remove("activa");
      pantallaJuego.classList.add("activa");

      seleccionadas.forEach(id => {
        const contenedor = document.createElement("div");
        contenedor.classList.add("carta-juego");
        contenedor.innerHTML = `<img src="${id}.jpg">`;
        contenedor.onclick = e => marcarFicha(e, contenedor);
        juegoCartas.appendChild(contenedor);
      });
    };

    function marcarFicha(e, contenedor) {
      const imgCarta = contenedor.querySelector("img");
      const bounds = imgCarta.getBoundingClientRect();
      const x = e.clientX - bounds.left;
      const y = e.clientY - bounds.top;
      const px = (x / bounds.width) * 100;
      const py = (y / bounds.height) * 100;

      const ficha = document.createElement("img");
      ficha.src = "ficha.PNG";
      ficha.classList.add("ficha");
      ficha.style.left = `${px}%`;
      ficha.style.top = `${py}%`;

      contenedor.appendChild(ficha);
    }

    function limpiarFichas() {
      document.querySelectorAll(".ficha").forEach(f => f.remove());
    }

    function barajearCartas() {
      mezcladas = Array.from({ length: 54 }, (_, i) => String(i + 1).padStart(2, '0'))
        .sort(() => Math.random() - 0.5);
      index = 0;
      historial.innerHTML = '';
      reproducirSonido("barajar.mp3");
    }

    function iniciarBarajeo() {
      reproducirSonido("campana.mp3");
      reproducirSonido("corre.mp3");

      intervalo = setInterval(() => {
        if (index < mezcladas.length) {
          const nombre = mezcladas[index];
          socket.emit("cartaCantada", nombre); // Avisar a todos
          index++;
        } else {
          detenerJuego();
        }
      }, tiempo);
    }

    function mostrarEnHistorial(nombre) {
      const img = document.createElement("img");
      img.src = `${nombre}.png`;
      historial.appendChild(img);
      reproducirSonido(`${nombre}.mp3`);
    }

    function detenerJuego() {
      clearInterval(intervalo);
      reproducirSonido("aplausos.mp3");
    }

    function reproducirSonido(nombre) {
      const audio = new Audio(nombre);
      audio.play();
    }

    function gritarLoteria() {
      alert("¡Lotería! 🎉 Avísale al host.");
    }

    // --- SOCKET EVENTS ---
    socket.on("esHost", () => {
      controlesHost.style.display = "block";
    });

    socket.on("cartasOcupadas", (ocupadas) => {
      document.querySelectorAll(".carta-img").forEach(img => {
        if (ocupadas.includes(img.dataset.id)) {
          img.classList.add("deshabilitada");
        }
      });
    });

    socket.on("actualizarHistorial", (lista) => {
      historial.innerHTML = "";
      lista.forEach(nombre => mostrarEnHistorial(nombre));
    });
  </script>
</body>
</html>
