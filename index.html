<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotería Mexicana</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
    }
    .pantalla {
      display: none;
      padding: 20px;
    }
    .activa {
      display: block;
    }
    .cartas-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .carta {
      width: 150px;
      border: 4px solid gold;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .carta:hover {
      transform: scale(1.05);
    }
    .carta.tachada::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.5);
      pointer-events: none;
    }
    #botonIniciar {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: gold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .juego-cartas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .juego-carta {
      width: 180px;
      position: relative;
    }
    .ficha {
      width: 25px;
      height: 25px;
      position: absolute;
      pointer-events: none;
    }
    #limpiar {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Pantalla 1 -->
<div id="pantallaSeleccion" class="pantalla activa">
  <h2>Selecciona tus 2 cartas:</h2>
  <div class="cartas-container" id="cartasDisponibles"></div>
  <button id="botonIniciar" style="display:none">Iniciar Juego</button>
</div>

<!-- Pantalla 2 -->
<div id="pantallaJuego" class="pantalla">
  <h2>¡A jugar!</h2>
  <div class="juego-cartas" id="cartasJuego"></div>
  <button id="limpiar">Limpiar fichas</button>
</div>

<script>
  const MAX_CARTAS = 2;
  const fichas = [];
  let cartasSeleccionadas = [];

  const contenedorCartas = document.getElementById('cartasDisponibles');
  const contenedorJuego = document.getElementById('cartasJuego');
  const botonIniciar = document.getElementById('botonIniciar');
  const btnLimpiar = document.getElementById('limpiar');

  // Generar cartas para seleccionar
  for (let i = 1; i <= 10; i++) {
    const carta = document.createElement('img');
    carta.src = `${String(i).padStart(2, '0')}.jpg`;
    carta.classList.add('carta');
    carta.dataset.id = i;
    carta.addEventListener('click', () => seleccionarCarta(carta));
    contenedorCartas.appendChild(carta);
  }

  function seleccionarCarta(carta) {
    if (carta.classList.contains('tachada')) return;

    if (cartasSeleccionadas.length < MAX_CARTAS) {
      carta.classList.add('tachada');
      cartasSeleccionadas.push(carta.dataset.id);
      if (cartasSeleccionadas.length === MAX_CARTAS) {
        botonIniciar.style.display = 'inline-block';
      }
    }
  }

  botonIniciar.addEventListener('click', () => {
    document.getElementById('pantallaSeleccion').classList.remove('activa');
    document.getElementById('pantallaJuego').classList.add('activa');
    cargarCartasDeJuego();
  });

  function cargarCartasDeJuego() {
    cartasSeleccionadas.forEach(id => {
      const contenedor = document.createElement('div');
      contenedor.classList.add('juego-carta');

      const img = document.createElement('img');
      img.src = `${String(id).padStart(2, '0')}.jpg`;
      img.style.width = '100%';
      img.addEventListener('click', (e) => colocarFicha(e, contenedor));

      contenedor.appendChild(img);
      contenedorJuego.appendChild(contenedor);
    });
  }

  function colocarFicha(e, contenedor) {
    const ficha = document.createElement('img');
    ficha.src = 'ficha.png';
    ficha.classList.add('ficha');
    ficha.style.left = (e.offsetX - 12) + 'px';
    ficha.style.top = (e.offsetY - 12) + 'px';
    contenedor.appendChild(ficha);
    fichas.push(ficha);
  }

  btnLimpiar.addEventListener('click', () => {
    fichas.forEach(f => f.remove());
    fichas.length = 0;
  });
</script>

</body>
</html>
