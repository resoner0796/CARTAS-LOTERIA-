<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Lotería WebApp</title>
#btnApostar { background-color: #28a745; color: white; border-radius: 8px; padding: 0.4rem 0.8rem; }
    #btnApostar:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="pantallaSplash" class="pantalla activa"><h1>Cargando...</h1></div>
  <div id="pantallaSala" class="pantalla">
    <h2>Selecciona una sala</h2>
    <select id="salaSelect">
      <option value="Amigos">Amigos</option>
      <option value="Familia">Familia</option>
      <option value="Oficina">Oficina</option>
    </select>
    <button onclick="irANickname()">Continuar</button>
  </div>
  <div id="pantallaNickname" class="pantalla">
    <h2>Ingresa tu nickname</h2>
    <input type="text" id="nicknameInput" placeholder="Tu nombre..." />
    <button onclick="entrarJuego()">Entrar</button>
  </div>
  <div id="pantallaSeleccion" class="pantalla">
    <h1>Selecciona tus cartas</h1>
    <div class="cartas-container" id="contenedorCartas"></div>
    <button id="btnIniciar" style="display:none">Continuar</button>
  </div>
  <div id="pantallaJuego" class="pantalla">

    <!-- Historial movido a la parte superior -->
    <div class="historial-container">
      <div id="historial"></div>
    </div>
    
    
    <div class="juego-cartas" id="juegoCartas"></div>
    <div>
      <button onclick="limpiarFichas()">Limpiar cartas</button>
      <button id="btnBarajear" onclick="socket.emit('barajear', salaActual)">Barajear</button>
      <button id="btnIniciarJuego" onclick="socket.emit('iniciar-juego', salaActual)">Iniciar juego</button>
      <button id="btnDetenerJuego" onclick="socket.emit('detener-juego', salaActual)">Detener juego</button>
      <button id="btnReiniciar" onclick="socket.emit('reiniciar-partida', salaActual)">Reiniciar partida</button>
      <button onclick="emitirLoteria()">Lotería</button>
    </div>
    
    <!-- UI de apuestas actualizada -->
    <div id="apuestasUI" style="display:flex;align-items:center;gap:24px;margin-top:8px;">
      <div style="display:flex;align-items:flex-end;">
          <div class="monedas-apiladas">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
          </div>
          <div class="monedas-apiladas">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
          </div>
          <div class="monedas-apiladas">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
              <img src="peso.png" alt="peso" class="moneda-stack">
          </div>
      </div>
      <strong id="monedas-valor">30</strong>
      <div class="apuesta-control" style="display:flex;flex-direction:column;align-items:center;">
          <div class="bote-monedas">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
              <img src="peso.png" alt="moneda">
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;margin-top: 30px;">
              <div class="bote-info" style="display:flex;flex-direction:column;align-items:center;">
                  <strong id="bote-valor">0</strong>
                  <span style="font-weight:600;font-size:0.8rem">Bote</span>
              </div>
              <button id="btnApostar">Apostar</button>
          </div>
      </div>
    </div>
    
    <div id="jugadoresLista"></div>
  </div>

  <div id="loteriaMensaje">¡LOTERÍA!</div>

  <audio id="audioBarajear" src="barajar.mp3"></audio>
  <audio id="audioCampana" src="campana.mp3"></audio>
  <audio id="audioCorre" src="corre.mp3"></audio>
  <audio id="audioAplausos" src="aplausos.mp3"></audio>

  <script src="https://loteria-backend-3nde.onrender.com/socket.io/socket.io.js"></script>
  <script>
    // Declaración de variables globales
    let jugadoresGlobal = {};
    let miId;
    const socket = io("https://loteria-backend-3nde.onrender.com");

    let nickname = "";
    let soyHost = false;
    let seleccionadas = [];
    let salaActual = "";
    // El set de cartas del jugador es diferente al de las barajitas del mazo
    const cartasDisponibles = Array.from({ length: 16 }, (_, i) => String(i + 1).padStart(2, '0'));

    const pantallas = {
      splash: document.getElementById("pantallaSplash"),
      sala: document.getElementById("pantallaSala"),
      nickname: document.getElementById("pantallaNickname"),
      seleccion: document.getElementById("pantallaSeleccion"),
      juego: document.getElementById("pantallaJuego")
    };

    const contenedorCartas = document.getElementById("contenedorCartas");
    const juegoCartas = document.getElementById("juegoCartas");
    const btnIniciar = document.getElementById("btnIniciar");
    const historial = document.getElementById("historial");
    const jugadoresLista = document.getElementById("jugadoresLista");

    const btnApostar = document.getElementById("btnApostar");
    const monedasEl = document.getElementById("monedas-valor");
    const boteEl = document.getElementById("bote-valor");
    let haApostadoLocal = false;

    btnApostar && btnApostar.addEventListener("click", () => {
      if (!salaActual) return alert("Únete a una sala primero.");
      if (haApostadoLocal) return alert("Ya apostaste esta ronda.");
      const cantidad = Math.max(1, seleccionadas.length || 1);
      socket.emit("apostar", { sala: salaActual, cantidad });
      haApostadoLocal = true;
      btnApostar.disabled = true;
    });

    socket.on("error-apuesta", msg => {
      alert(msg || "Error al apostar");
      haApostadoLocal = false;
      if (btnApostar) btnApostar.disabled = false;
    });

    const audioBarajear = document.getElementById("audioBarajear");
    const audioCampana = document.getElementById("audioCampana");
    const audioCorre = document.getElementById("audioCorre");
    const audioAplausos = document.getElementById("audioAplausos");

    const loteriaMensaje = document.getElementById("loteriaMensaje");

    window.onload = () => setTimeout(() => cambiarPantalla("sala"), 1000);

    function cambiarPantalla(nombre) {
      Object.values(pantallas).forEach(p => p.classList.remove("activa"));
      pantallas[nombre].classList.add("activa");
      if (nombre === "seleccion") pantallas["seleccion"].scrollTo(0, 0);
    }

    function irANickname() {
      salaActual = document.getElementById("salaSelect").value;
      cambiarPantalla("nickname");
    }

    function entrarJuego() {
      nickname = document.getElementById("nicknameInput").value.trim();
      if (!nickname) return alert("Escribe tu nombre");
      socket.emit("unirse-sala", { nickname, sala: salaActual });
    }

    socket.on('connect', () => {
      miId = socket.id;
    });

    socket.on("rol-asignado", ({ host }) => {
      soyHost = host;
      cambiarPantalla("seleccion");
      generarCartas();
      if (!soyHost) {
        ["btnBarajear", "btnIniciarJuego", "btnDetenerJuego", "btnReiniciar"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.display = "none";
        });
      }
    });

    socket.on("barajear", () => {
      audioBarajear.currentTime = 0;
      audioBarajear.play().catch(e => console.warn("Audio bloqueado:", e));
      historial.innerHTML = "";
    });

    socket.on("campana", () => {
      audioCampana.currentTime = 0;
      audioCampana.play().catch(() => {});
    });

    socket.on("corre", () => {
      audioCorre.currentTime = 0;
      audioCorre.play().catch(() => {});
    });

    socket.on("partida-reiniciada", () => {
      seleccionadas = [];
      juegoCartas.innerHTML = "";
      btnIniciar.style.display = "none";
      cambiarPantalla("seleccion");
      generarCartas();
      if (btnApostar) {
        haApostadoLocal = false;
        btnApostar.disabled = false;
      }
    });

    function generarCartas() {
      contenedorCartas.innerHTML = "";
      cartasDisponibles.forEach(id => {
        const img = document.createElement("img");
        // Las cartas de los jugadores son .jpg
        img.src = `${id}.jpg`;
        img.classList.add("carta-img");
        img.dataset.id = id;
        img.onclick = () => seleccionarCarta(img);
        contenedorCartas.appendChild(img);
      });
    }

    function seleccionarCarta(img) {
      const id = img.dataset.id;
      if (seleccionadas.includes(id)) return;
      if (seleccionadas.length < 3) {
        img.classList.add("seleccionada");
        seleccionadas.push(id);
        socket.emit("seleccionar-carta", { carta: id, sala: salaActual });
        if (seleccionadas.length >= 2) btnIniciar.style.display = "block";
      }
    }

    btnIniciar.onclick = () => {
      cambiarPantalla("juego");
      juegoCartas.innerHTML = "";
      seleccionadas.forEach(id => {
        const contenedor = document.createElement("div");
        contenedor.classList.add("carta-juego");
        contenedor.innerHTML = `<img src="${id}.jpg" class="carta-img seleccionada">`;
        contenedor.onclick = e => marcarFicha(e, contenedor);
        juegoCartas.appendChild(contenedor);
      });
    };

    function marcarFicha(e, contenedor) {
      const img = contenedor.querySelector("img");
      const bounds = img.getBoundingClientRect();
      const x = e.clientX - bounds.left;
      const y = e.clientY - bounds.top;
      const px = (x / bounds.width) * 100;
      const py = (y / bounds.height) * 100;
      const ficha = document.createElement("img");
      ficha.src = "ficha.PNG";
      ficha.classList.add("ficha");
      ficha.style.left = `${px}%`;
      ficha.style.top = `${py}%`;
      contenedor.appendChild(ficha);
    }

    function limpiarFichas() {
      document.querySelectorAll(".ficha").forEach(f => f.remove());
    }

    function emitirLoteria() {
      audioCorre.pause();
      audioCampana.pause();
      audioBarajear.pause();
      mostrarLoteriaMensaje();
      socket.emit("loteria", { nickname, sala: salaActual });
    }

    function mostrarLoteriaMensaje() {
      loteriaMensaje.style.display = "block";
      for (let i = 0; i < 100; i++) {
        const confeti = document.createElement("div");
        confeti.classList.add("confeti");
        confeti.style.left = Math.random() * 100 + "vw";
        confeti.style.top = "-10px";
        confeti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
        confeti.style.animationDelay = (Math.random() * 2) + "s";
        document.body.appendChild(confeti);
        confeti.addEventListener("animationend", () => confeti.remove());
      }
      setTimeout(() => {
        loteriaMensaje.style.display = "none";
      }, 4000);
    }

    socket.on("cartas-desactivadas", ids => {
      document.querySelectorAll(".carta-img").forEach(img => {
        if (ids.includes(img.dataset.id)) {
          img.style.opacity = 0.3;
          img.style.pointerEvents = "none";
        }
      });
    });

    socket.on("historial-actualizado", historialRecibido => {
      historial.innerHTML = "";
      historialRecibido.forEach(id => {
        const img = document.createElement("img");
        // CORRECCIÓN: Asegurar el formato "01" y usar .png para las barajas del historial
        const formattedId = String(id).padStart(2, '0');
        img.src = `${formattedId}.png`;
        historial.prepend(img);
      });
    });

    socket.on("jugadores-actualizados", jugadores => {
      jugadoresGlobal = jugadores;
      if (jugadores[miId]) {
        monedasEl.textContent = jugadores[miId].monedas;
      }
      jugadoresLista.innerHTML = "<h3>Jugadores conectados:</h3>" +
        Object.values(jugadores).map(j => {
          const check = j.apostado ? "💸" : "";
          const monedas = (typeof j.monedas !== "undefined") ? j.monedas : "-";
          return `<div>${j.nickname} ${check}</div>`;
        }).join("");
      if (jugadores[miId] && !jugadores[miId].apostado && btnApostar) {
        haApostadoLocal = false;
        btnApostar.disabled = false;
      }
    });
    
    socket.on('monedas-actualizado', (monedas) => {
        if (monedasEl) {
            monedasEl.textContent = monedas;
        }
    });    
    socket.on('bote-actualizado', (bote) => {
      boteEl.textContent = bote;
    });

    socket.on("carta-cantada", (cartaId) => {
      const img = document.createElement("img");
      // CORRECCIÓN: Asegurar el formato "01" y usar .png para las barajas del historial
      const formattedId = String(cartaId).padStart(2, '0');
      img.src = `${formattedId}.png`;
      historial.prepend(img);
      const audioVoz = new Audio(`${formattedId}.mp3`);
      audioVoz.play();
    });

    socket.on("loteria-anunciada", (quien, ganadorId) => {
      alert(`¡${quien} ha cantado LOTERÍA!`);
      if (soyHost) {
        const confirmar = confirm(`¿${quien} es el ganador?`);
        if (confirmar) {
          socket.emit('confirmar-ganador', { sala: salaActual, ganadorId });
        }
      }
    });

    socket.on("juego-detenido", () => {
      if (soyHost) {
        audioAplausos.play();
      }
    });

    // Registrar Service Worker para PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").then(reg => {
          console.log("✅ Service Worker registrado:", reg);
        }).catch(err => {
          console.error("❌ Error al registrar Service Worker:", err);
        });
      });
    }
  </script>
</body>
</html>
